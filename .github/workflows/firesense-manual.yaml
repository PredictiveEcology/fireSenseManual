## Workflow based on from https://github.com/r-lib/actions/tree/v2/examples/bookdown.yaml

name: fireSense manual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    ## This manual documents the modules' development branches, so it goes stale
    ## on its own without anything changing here. Rebuild daily.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-manual-site:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      ## Module sources.
      ##
      ## These were git submodules, which record a commit: every module change
      ## then needed someone to bump a pointer here before the manual could show
      ## it. This manual is meant to track the modules' development, so each is
      ## checked out by branch instead. The ref below is an intent, and a
      ## scheduled build picks up whatever it points at that day.
      ##
      ## Adding a module here also needs a matching chapter entry in _bookdown.yml.
      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense
          ref: development
          path: modules/fireSense

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_dataPrepFit
          ref: development
          path: modules/fireSense_dataPrepFit

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_dataPrepPredict
          ref: development
          path: modules/fireSense_dataPrepPredict

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_ELFs
          ref: development
          path: modules/fireSense_ELFs

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_EscapeFit
          ref: development
          path: modules/fireSense_EscapeFit

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_EscapePredict
          ref: development
          path: modules/fireSense_EscapePredict

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_hindcast
          ref: main
          path: modules/fireSense_hindcast

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_IgnitionFit
          ref: development
          path: modules/fireSense_IgnitionFit

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_IgnitionPredict
          ref: development
          path: modules/fireSense_IgnitionPredict

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_SpreadFit
          ref: development
          path: modules/fireSense_SpreadFit

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_SpreadPredict
          ref: development
          path: modules/fireSense_SpreadPredict

      - uses: actions/checkout@v7
        with:
          repository: PredictiveEcology/fireSense_summary
          ref: development
          path: modules/fireSense_summary

      ## Which module commits this build actually used. Without submodules there
      ## is no pointer in the tree to read it off, and a scheduled build of
      ## moving branches is not reproducible from the manual's own history.
      - name: Record module versions
        run: |
          {
            echo "### Module sources"
            echo
            echo "| module | ref | commit |"
            echo "| --- | --- | --- |"
            for d in modules/*/; do
              m=$(basename "$d")
              echo "| $m | $(git -C "$d" rev-parse --abbrev-ref HEAD) | $(git -C "$d" rev-parse --short HEAD) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@main

      - name: Install additional system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
          libarchive-dev \
          libcurl4-openssl-dev \
          libgit2-dev \
          libglpk-dev \
          libmagick++-dev \
          libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          use-public-rspm: false

      ## Installing the SpaDES stack from source is most of this job's runtime,
      ## which a daily schedule would otherwise pay every day.
      - name: Cache R library
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rlib-${{ hashFiles('DESCRIPTION') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-rlib-${{ hashFiles('DESCRIPTION') }}-
            ${{ runner.os }}-rlib-

      - uses: PredictiveEcology/actions/install-Require@main
        with:
          GitTag: 'development'

      - uses: PredictiveEcology/actions/install-SpaDES@main

      - uses: PredictiveEcology/actions/install-Rmd-pkgs@main

      - name: Install module packages and other dependencies
        run: |
          source("install.R")
        shell: Rscript {0}

      - name: Cache bookdown results
        uses: actions/cache@v6
        with:
          path: _bookdown_files
          key: bookdown-${{ hashFiles('**/*Rmd') }}
          restore-keys: bookdown-

      - name: Build fireSense manual
        run: |
          source("build.R")
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
